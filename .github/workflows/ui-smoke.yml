name: UI smoke (TV emulator)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Release build signed with a throwaway key made here and discarded with the CI machine.
      - name: Build debug APK and CI-signed release APK
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -alias ci -keyalg RSA -keysize 2048 \
            -validity 2 -storepass ci-only -keypass ci-only -dname "CN=NorthEast CI throwaway"
          printf 'storeFile=%s\nstorePassword=ci-only\nkeyAlias=ci\nkeyPassword=ci-only\n' "$RUNNER_TEMP/ci.jks" > keystore.properties
          ./gradlew assembleDebug assembleRelease
          rm keystore.properties

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android TV emulator
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/ci/ui-smoke.sh

      - name: Upload screenshots and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke
          path: ui-smoke/
          retention-days: 14
