name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build debug APK and unsigned release APK
        run: ./gradlew --stacktrace assembleDebug assembleRelease

      - name: Verify the APKs request no network permissions
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            echo "== $apk"
            "$AAPT2" dump permissions "$apk" | tee permissions.txt
            if grep -E "android.permission.(INTERNET|ACCESS_NETWORK_STATE|ACCESS_WIFI_STATE)" permissions.txt; then
              echo "::error::The launcher must not request network permissions ($apk)."
              exit 1
            fi
          done
          ls -l app/build/outputs/apk/*/*.apk

      - name: Make sure no signing secrets are tracked
        run: |
          if git ls-files | grep -E '(^|/)keystore\.properties$|\.(jks|keystore|p12)$'; then
            echo "::error::Signing secrets must never be committed."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: northeast-launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14
